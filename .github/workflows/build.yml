name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Сборка frontend (нужен для go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test
        run: go test ./...

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Build Linux
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform linux/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: stillroom-linux-amd64
          path: build/bin/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Build Windows
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform windows/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: stillroom-windows-amd64
          path: build/bin/*
