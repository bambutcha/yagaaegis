name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test
        run: go test ./...

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deps
        run: |
          sudo apt-get update
          # Ubuntu 24.04 (ubuntu-latest): webkit 4.1; package.sh передаёт -tags webkit2_41
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          wails version
          go version
          node -v
      - name: Package
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          chmod +x scripts/*.sh
          ./scripts/package.sh linux amd64
      - uses: actions/upload-artifact@v4
        with:
          name: yagaaegis-linux-amd64
          path: dist/YagaAegis-linux-amd64.tar.gz

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wails + NSIS + zip
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          choco install nsis zip -y
          echo "$PROGRAMFILES/NSIS" >> "$GITHUB_PATH"
          echo "$PROGRAMFILES (x86)/NSIS" >> "$GITHUB_PATH"
          wails version
          go version
          node -v
      - name: Package portable + NSIS
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin:/c/Program Files (x86)/NSIS:/c/Program Files/NSIS"
          chmod +x scripts/*.sh
          ./scripts/package.sh windows amd64 --nsis
          mkdir -p dist
          cp -a build/bin/*-installer.exe dist/ 2>/dev/null || true
          ls -la dist/ build/bin/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: yagaaegis-windows-amd64
          path: |
            dist/YagaAegis-windows-amd64.zip
            dist/*-installer.exe
            build/bin/*-installer.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*installer.exe' \) -exec cp -a {} release/ \;
          ls -lh release/
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
